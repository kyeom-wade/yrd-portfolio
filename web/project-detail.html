<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝트 — YRD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="header-brand">yrd</a>
      <nav class="header-nav">
        <a href="about.html" data-nav="about">회사 소개</a>
        <a href="works.html" data-nav="works">프로젝트</a>
        <a href="contact.html" data-nav="contact">문의</a>
      </nav>
      <div class="header-actions">
        <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">Menu</button>
      </div>
    </div>
  </header>

  <main class="project-detail-page">
    <header class="container-narrow article-head">
      <a href="works.html" class="back-link"><span aria-hidden="true">←</span> 프로젝트 목록</a>
      <p class="article-meta">
        <span class="meta-item category"></span>
        <span class="meta-item location"></span>
        <span class="meta-item year"></span>
      </p>
      <h1 class="detail-title"></h1>
    </header>

    <figure class="container-wide detail-hero">
      <img class="detail-hero-image" src="" alt="" loading="eager">
    </figure>

    <article class="container-narrow article-body">
      <p class="description-text"></p>

      <dl class="specs-list">
        <div class="spec-item"><dt>클라이언트</dt><dd class="spec-client"></dd></div>
        <div class="spec-item"><dt>연도</dt><dd class="spec-year"></dd></div>
        <div class="spec-item"><dt>면적</dt><dd class="spec-area"></dd></div>
        <div class="spec-item"><dt>용도</dt><dd class="spec-usage"></dd></div>
        <div class="spec-item"><dt>구조</dt><dd class="spec-structure"></dd></div>
        <div class="spec-item"><dt>재료</dt><dd class="spec-materials"></dd></div>
      </dl>

      <div class="gallery-container"></div>
    </article>

    <nav class="container-narrow detail-navigation">
      <a href="#" class="nav-prev" hidden>
        <span class="nav-label">← 이전 프로젝트</span>
        <span class="nav-title"></span>
      </a>
      <a href="#" class="nav-next" hidden>
        <span class="nav-label">다음 프로젝트 →</span>
        <span class="nav-title"></span>
      </a>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-brand">yeorum design studio</p>
      <p class="footer-info" data-footer-info></p>
      <p class="footer-copy">© <span data-year></span> yeorum design studio. All rights reserved.</p>
    </div>
  </footer>

  <div class="menu-overlay" id="menuOverlay">
    <a href="index.html" class="overlay-brand"><span class="ob-l">y</span><span class="ob-f ob-f1"><span class="ob-fi">eo</span></span><span class="ob-l">r</span><span class="ob-f ob-f2"><span class="ob-fi">um&nbsp;</span></span><span class="ob-l">d</span><span class="ob-f ob-f3"><span class="ob-fi">esign studio</span></span></a>
    <button class="menu-close" id="menuClose">Close</button>
    <nav class="overlay-nav">
      <a href="about.html">회사 소개</a>
      <a href="works.html">프로젝트</a>
      <a href="contact.html">문의</a>
    </nav>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
