<!DOCTYPE html>
<html lang="ko">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<body class="page-home">
  <header class="site-header">
    <div class="header-inner">

        <a href="works.html" data-nav="works">프로젝트</a>

      <div class="header-actions">
        <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">Menu</button>
      </div>

  <main class="home-page">
    <div class="hero-stage">
      <section class="hero-banner" aria-label="메인 배너">
        <img class="hero-image" src="" alt="" fetchpriority="high">

    <section class="container page-head">
      <h1 class="page-title" data-reveal>yeorum design studio</h1>
      <p class="home-statement" data-home-lead></p>

            <ol class="story-steps"></ol>
            <div class="story-visual" aria-hidden="true"></div>
          </div>

      </div>

    <section class="container">

        <div>
          <p class="cta-title">당신의 공간을 만들어보세요.</p>
          <p class="cta-sub">새로운 프로젝트에 대해 이야기 나눠요.</p>
        </div>
        <a href="contact.html" class="btn-primary">문의하기</a>

      <p class="footer-info" data-footer-info></p>
      <p class="footer-copy">© <span data-year></span> yeorum design studio. All rights reserved.</p>

  <div class="menu-overlay" id="menuOverlay">
    <a href="index.html" class="overlay-brand"><span class="ob-l">y</span><span class="ob-f ob-f1"><span class="ob-fi">eo</span></span><span class="ob-l">r</span><span class="ob-f ob-f2"><span class="ob-fi">um&nbsp;</span></span><span class="ob-l">d</span><span class="ob-f ob-f3"><span class="ob-fi">esign studio</span></span></a>
