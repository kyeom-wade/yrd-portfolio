<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의 — YRD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="header-brand">yrd</a>
      <nav class="header-nav">
        <a href="about.html" data-nav="about">회사 소개</a>
        <a href="works.html" data-nav="works">프로젝트</a>
        <a href="contact.html" data-nav="contact">문의</a>
      </nav>
      <div class="header-actions">
        <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">Menu</button>
      </div>
    </div>
  </header>

  <main class="contact-page container-narrow">
    <section class="page-head">
      <h1 class="page-title">문의</h1>
      <p class="page-lead">새로운 공간에 대한 이야기, 편하게 연락 주세요.</p>
    </section>
    <dl class="info-list">
      <div class="contact-info-group"><dt class="label">연락처</dt><dd class="value" data-field="phone"></dd></div>
      <div class="contact-info-group"><dt class="label">이메일</dt><dd class="value" data-field="email"></dd></div>
      <div class="contact-info-group"><dt class="label">인스타그램</dt><dd class="value" data-field="instagram"></dd></div>
      <div class="contact-info-group"><dt class="label">주소</dt><dd class="value" data-field="address"></dd></div>
      <div class="contact-info-group"><dt class="label">운영시간</dt><dd class="value" data-field="hours"></dd></div>
    </dl>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-brand">yeorum design studio</p>
      <p class="footer-info" data-footer-info></p>
      <p class="footer-copy">© <span data-year></span> yeorum design studio. All rights reserved.</p>
    </div>
  </footer>

  <div class="menu-overlay" id="menuOverlay">
    <a href="index.html" class="overlay-brand"><span class="ob-l">y</span><span class="ob-f ob-f1"><span class="ob-fi">eo</span></span><span class="ob-l">r</span><span class="ob-f ob-f2"><span class="ob-fi">um&nbsp;</span></span><span class="ob-l">d</span><span class="ob-f ob-f3"><span class="ob-fi">esign studio</span></span></a>
    <button class="menu-close" id="menuClose">Close</button>
    <nav class="overlay-nav">
      <a href="about.html">회사 소개</a>
      <a href="works.html">프로젝트</a>
      <a href="contact.html">문의</a>
    </nav>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
